<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Master Password</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 30px;
            margin: 0;
        }

        h2 {
            margin: 0 0 16px;
        }

        p {
            margin: 0 0 20px;
        }

        #error {
            color: #ff6b6b;
            font-weight: bold;
            min-height: 24px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            max-width: 340px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #2d2d2d;
            color: white;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        button {
            padding: 10px 28px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        #submit {
            background: #0066cc;
            color: white;
            border: none;
        }

        #cancel {
            background: #444;
            color: white;
            border: none;
        }
    </style>
</head>

<body>
    <h2>Enter Master Password</h2>
    <p>To merge cloud data securely, please enter your master password.</p>

    <div id="error"></div>

    <input type="password" id="password" placeholder="Master password" autofocus />

    <div class="buttons">
        <button id="submit">Merge</button>
        <button id="cancel">Cancel</button>
    </div>
