<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Vault - Restore Backup</title>
    <style>
        :root {
            --z-vault-bg-primary: #020617;
            --z-vault-bg-secondary: #0f172a;
            --z-vault-accent: #6366f1;
            --z-vault-accent-dark: #4d4fc2;
            --z-vault-text: #e2e8f0;
            --z-vault-text-muted: #94a3b8;
            --z-vault-card-bg: rgba(255, 255, 255, 0.04);
            --z-vault-card-border: rgba(255, 255, 255, 0.08);
            --z-vault-card: #16161a;
            --z-vault-radius: 16px;
            --z-vault-background-drop-shadow: rgba(0, 0, 0, 0.3) 0px 19px 38px, rgba(0, 0, 0, 0.22) 0px 15px 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, var(--z-vault-bg-primary) 0%, var(--z-vault-bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes ripple {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(99, 102, 241, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        .z_vault__backup_overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .z_vault__backup_modal {
            background: var(--z-vault-card);
            border: 1px solid var(--z-vault-card-border);
            border-radius: var(--z-vault-radius);
            box-shadow: var(--z-vault-background-drop-shadow);
            padding: 48px 40px;
            max-width: 480px;
            width: 90%;
            animation: slideInDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .z_vault__backup_header {
            text-align: center;
            margin-bottom: 48px;
        }

        .z_vault__backup_icon-wrapper {
            margin-bottom: 24px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .z_vault__backup_icon {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--z-vault-accent) 0%, var(--z-vault-accent-dark) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .z_vault__backup_title {
            font-size: 28px;
            font-weight: 800;
            color: var(--z-vault-text);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            animation: slideInDown 0.6s ease-out 0.1s both;
        }

        .z_vault__backup_subtitle {
            font-size: 14px;
            color: var(--z-vault-text-muted);
            font-weight: 400;
            animation: slideInDown 0.6s ease-out 0.2s both;
        }

        .z_vault__backup_actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .z_vault__backup_button {
            padding: 20px 24px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            animation: slideInDown 0.6s ease-out both;
        }

        .z_vault__backup_button:nth-child(1) {
            animation-delay: 0.3s;
        }

        .z_vault__backup_button:nth-child(2) {
            animation-delay: 0.4s;
        }

        .z_vault__backup_button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.5s ease;
            z-index: 1;
        }

        .z_vault__backup_button:hover::before {
            left: 100%;
        }

        .z_vault__backup_button:hover {
            transform: translateY(-3px);
        }

        .z_vault__backup_button:active {
            transform: translateY(-1px);
        }

        .z_vault__backup_button-google {
            background: var(--z-vault-card-bg);
            border: 1.5px solid var(--z-vault-card-border);
            color: var(--z-vault-text);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .z_vault__backup_button-google:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .z_vault__backup_button-local {
            background: linear-gradient(135deg, var(--z-vault-accent) 0%, var(--z-vault-accent-dark) 100%);
            color: var(--z-vault-text);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            border: none;
        }

        .z_vault__backup_button-local:hover {
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4), 
                        0 0 20px rgba(99, 102, 241, 0.2);
        }

        .z_vault__backup_button span {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .z_vault__backup_icon-svg {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .z_vault__backup_icon-emoji {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .z_vault__backup_footer {
            text-align: center;
            margin-top: 32px;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }

        .z_vault__backup_footer-text {
            font-size: 13px;
            color: var(--z-vault-text-muted);
            line-height: 1.5;
        }

        .z_vault__backup_footer-link {
            color: var(--z-vault-accent);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .z_vault__backup_footer-link:hover {
            color: rgba(99, 102, 241, 0.8);
        }

        /* Toast Notification */
        .z_vault__backup_toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--z-vault-accent) 0%, var(--z-vault-accent-dark) 100%);
            color: var(--z-vault-text);
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            z-index: 9999;
            opacity: 0;
            transform: translateX(-50%) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .z_vault__backup_toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .z_vault__backup_toast.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(30px);
        }

        @media (max-width: 480px) {
            .z_vault__backup_modal {
                padding: 40px 28px;
                max-width: 95%;
            }

            .z_vault__backup_title {
                font-size: 24px;
            }

            .z_vault__backup_button {
                padding: 18px 20px;
                font-size: 15px;
            }

            .z_vault__backup_icon {
                width: 64px;
                height: 64px;
                font-size: 32px;
            }

            .z_vault__backup_header {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Backup Modal -->
    <div class="z_vault__backup_overlay">
        <div class="z_vault__backup_modal">
            <!-- Header -->
            <div class="z_vault__backup_header">
                <div class="z_vault__backup_icon-wrapper">
                    <div class="z_vault__backup_icon">💾</div>
                </div>
                
                <h2 class="z_vault__backup_title">Restore Backup</h2>
                <p class="z_vault__backup_subtitle">Choose backup source to restore your vault</p>
            </div>

            <!-- Action Buttons -->
            <div class="z_vault__backup_actions">
                <!-- Google Backup -->
                <button class="z_vault__backup_button z_vault__backup_button-google" onclick="handleGoogleBackup()">
                    <span>
                        <span class="z_vault__backup_icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                        </span>
                        <span>Restore from Google</span>
                    </span>
                </button>

                <!-- Local Backup -->
                <button class="z_vault__backup_button z_vault__backup_button-local" onclick="handleLocalBackup()">
                    <span>
                        <span class="z_vault__backup_icon-emoji">💿</span>
                        <span>Restore from Local</span>
                    </span>
                </button>
            </div>

            <!-- Footer -->
            <div class="z_vault__backup_footer">
                <p class="z_vault__backup_footer-text">
                    <span class="z_vault__backup_footer-link" onclick="goBack()">← Go Back</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        function handleGoogleBackup() {
            console.log('Restore from Google Backup clicked');
            showFeedback('Connecting to Google Drive...');
            // Add your Google Backup restore logic here
            setTimeout(() => {
                showFeedback('Loading backup from Google Drive...');
            }, 1500);
        }

        function handleLocalBackup() {
            console.log('Restore from Local Backup clicked');
            showFeedback('Loading local backup files...');
            // Add your Local Backup restore logic here
            setTimeout(() => {
                showFeedback('Backup restored successfully!');
            }, 1500);
        }

        function goBack() {
            console.log('Going back to previous screen');
            showFeedback('Returning to startup...');
        }

        function showFeedback(message) {
            const toast = document.createElement('div');
            toast.className = 'z_vault__backup_toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hide');
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 2000);
        }

        console.log('Z Vault Backup Restore Modal Loaded');
    </script>
</body>
</html>
