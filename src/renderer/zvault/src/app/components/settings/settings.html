<main
    class="flex-1 flex flex-col h-screen overflow-hidden max-w-7xl mx-auto w-full">
    <app-header [title]="'Settings'" [addButtonText]="'New Preference'"
        [isDarkMode]="isDarkMode()" (toggleTheme)="toggleTheme.emit()"
        (addData)="addSetting.emit()">
    </app-header>

    <div class="flex-1 min-h-0 overflow-y-auto px-10 py-4">
        <div class="space-y-6">
            <section
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                <h2
                    class="text-base font-semibold text-slate-900 dark:text-slate-100 mb-4">
                    Vault Configuration</h2>
                <div class="space-y-4 max-w-xl">
                    <div class="flex items-center justify-between">
                        <div>
                            <p
                                class="text-sm font-medium text-slate-800 dark:text-slate-200">
                                Auto-lock Vault</p>
                            <p
                                class="text-xs text-slate-500 dark:text-slate-400">
                                Specify inactivity timeout period before locking
                                the database.</p>
                        </div>
                        <select
                            class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-700 dark:text-slate-300">
                            <option>5 Minutes</option>
                            <option>15 Minutes</option>
                            <option>1 Hour</option>
                            <option>Never</option>
                        </select>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>
