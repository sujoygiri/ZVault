<div
    class="flex flex-col sm:flex-row items-center justify-between gap-4 py-4 px-2 text-slate-600 dark:text-slate-400">

    <!-- Entry Info & Page Size Selector -->
    <div class="flex items-center gap-4 text-xs">
        <span>
            Showing
            <span class="font-semibold text-slate-900 dark:text-slate-100">{{
                startEntry() }}</span>
            to
            <span class="font-semibold text-slate-900 dark:text-slate-100">{{
                endEntry() }}</span>
            of
            <span class="font-semibold text-slate-900 dark:text-slate-100">{{
                totalEntries() }}</span>
            entries
        </span>

        <!-- Items per page dropdown -->
        <div
            class="flex items-center gap-1.5 border-l border-slate-200 dark:border-slate-800 pl-4">
            <label for="pageSize" class="text-slate-400">Per page:</label>
            <select id="pageSize" [value]="pageSize()"
                (change)="onPageSizeSelect($event)"
                class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 rounded-lg text-xs px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer">
                @for (option of pageSizeOptions(); track option) {
                <option [value]="option">{{ option }}</option>
                }
            </select>
        </div>
    </div>

    <!-- Page Navigation Controls -->
    <div class="flex items-center gap-1">

        <!-- Previous Button -->
        <button (click)="goToPage(currentPage() - 1)"
            [disabled]="currentPage() === 1"
            class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800/80 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition"
            aria-label="Previous page">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 19l-7-7 7-7" />
            </svg>
        </button>

        <!-- Number Buttons -->
        <div class="flex items-center gap-1">
            @for (page of visiblePages(); track $index) {
            @if (page === '...') {
            <span
                class="px-2 py-1 text-xs text-slate-400 tracking-widest select-none">...</span>
            } @else {
            <button (click)="goToPage(page)"
                [class.bg-blue-600]="page === currentPage()"
                [class.text-white]="page === currentPage()"
                [class.shadow-sm]="page === currentPage()"
                [class.bg-white]="page !== currentPage()"
                [class.dark:bg-slate-900]="page !== currentPage()"
                [class.text-slate-600]="page !== currentPage()"
                [class.dark:text-slate-300]="page !== currentPage()"
                [class.hover:bg-slate-50]="page !== currentPage()"
                [class.dark:hover:bg-slate-800]="page !== currentPage()"
                class="min-w-8 h-8 px-2 rounded-lg border border-slate-200 dark:border-slate-800/80 text-xs font-semibold transition flex items-center justify-center">
                {{ page }}
            </button>
            }
            }
        </div>

        <!-- Next Button -->
        <button (click)="goToPage(currentPage() + 1)"
            [disabled]="currentPage() === totalPages()"
            class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800/80 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition"
            aria-label="Next page">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 5l7 7-7 7" />
            </svg>
        </button>

    </div>
</div>
