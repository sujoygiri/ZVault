<div
  class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-800 dark:text-slate-200 flex h-screen w-full overflow-hidden antialiased transition-colors duration-200">

  <!-- SIDEBAR COMPONENT -->
  <app-sidebar [selectedMenuItem]="selectedMenuItem()"
    (selectMenuItem)="handleMenuItemSelect($event)">
  </app-sidebar>

  <!-- MAIN VIEWPORT CONTAINER -->
  <div
    class="flex-1 flex flex-col h-screen overflow-hidden max-w-7xl mx-auto w-full">

    <!-- VIEW CONTENT -->
    <div class="flex-1 min-h-0 overflow-hidden">
      @if (selectedMenuItem() === 'passwords') {
      <app-password-view [vaultItemPasswords]="vaultItemPasswords()"
        (toggleTheme)="toggleTheme()"
        (addPassword)="isAddEditDataModalOpen.set(true); dataEntryMode.set('add')"
        (sortChange)="handleSortChange($event)"
        (openTextView)="openTextViewModal($event.id, $event.title, $event.state)"
        (editPassword)="handlePasswordDataEdit($event.item, $event.state)"
        (deletePassword)="openDeleteConfirmationModal($event.id, $event.title)"
        >
      </app-password-view>
      } @else if (selectedMenuItem() === 'settings') {
      <app-settings (toggleTheme)="toggleTheme()"
        (addSetting)="handleSettingsAdd()">
      </app-settings>
      }
    </div>

    <!-- GLOBAL PAGINATION FOOTER -->
    @if (vaultItemPasswords().length) {
    <div
      class="shrink-0 px-10 py-3 bg-transparent border-t border-slate-200/50 dark:border-slate-800/50">
      <app-pagination [totalEntries]="globalService.totalEntries()"
        [currentPage]="globalService.currentPageNum()"
        [pageSize]="globalService.pageSize()"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
      </app-pagination>
    </div>
    }
  </div>

  <!-- GLOBAL MODALS -->
  <app-add-data [isOpen]="isAddEditDataModalOpen()"
    [passwordDataToBeEdited]="passwordDataToBeEdited()"
    [textDataToBeEdited]="textDataToBeEdited()"
    (close)="isAddEditDataModalOpen.set(false)"
    (selectedDataType)="selectedDataType.set($event)"
    (savePassword)="handleSavePassword($event)"
    (saveText)="handleSaveText($event)">
  </app-add-data>

  <app-text-view [isOpen]="isTextViewModalOpen()" [title]="textTitle()"
    [content]="textContent()" (close)="isTextViewModalOpen.set(false)">
  </app-text-view>

  <app-delete-confirmation [isOpen]="isDeleteConfirmationModalOpen()"
    [itemName]="deleteTargetName()" [itemId]="deleteTargetId()"
    (close)="isDeleteConfirmationModalOpen.set(false)"
    (confirmDelete)="handleDelete($event)">
  </app-delete-confirmation>

</div>
