@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/40 backdrop-blur-sm animate-fade-in"
    (click)="onClose()">

    <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl shadow-xl overflow-hidden p-6 animate-scale-in"
        (click)="$event.stopPropagation()">

        <div class="text-center pt-2">
            <!-- Warning Shield Icon -->
            <div
                class="mx-auto w-12 h-12 rounded-2xl bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 flex items-center justify-center mb-4 border border-red-100 dark:border-red-900/30">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>

            <!-- Content -->
            <h3
                class="text-base font-bold text-slate-900 dark:text-slate-50 leading-tight">
                Confirm Deletion</h3>
            <p
                class="text-xs text-slate-500 dark:text-slate-400 mt-2 max-w-sm mx-auto">
                Are you sure you want to delete <span
                    class="font-bold text-slate-800 dark:text-slate-200">"{{
                    itemName() }}"</span>? This action is permanent and cannot
                be undone.
            </p>

            <!-- Buttons -->
            <div class="mt-6 flex flex-col sm:flex-row gap-2.5">
                <button (click)="onClose()"
                    class="flex-1 order-2 sm:order-1 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold text-xs px-4 py-2.5 rounded-xl transition">
                    Cancel
                </button>
                <button (click)="onConfirmDelete()"
                    class="flex-1 order-1 sm:order-2 bg-red-600 dark:bg-red-700 text-white hover:bg-red-500 dark:hover:bg-red-600 font-semibold text-xs px-4 py-2.5 rounded-xl shadow-sm transition">
                    Confirm Delete
                </button>
            </div>
        </div>

    </div>
</div>
}
