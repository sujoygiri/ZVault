@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-in fade-in duration-200"
    (click)="closeModal()">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-6 space-y-5"
        (click)="$event.stopPropagation()">

        <!-- Header Icon & Title -->
        <div class="flex items-center gap-4">
            <div
                class="w-12 h-12 rounded-xl bg-rose-500/10 text-rose-500 flex items-center justify-center shrink-0 border border-rose-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <div>
                <h3
                    class="text-base font-bold text-slate-900 dark:text-slate-100">
                    Delete Entire Vault?</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                    This action is irreversible and permanent.</p>
            </div>
        </div>

        <!-- Description -->
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
            All your stored passwords, secure notes, and configuration records
            will be permanently wiped from this device. To confirm, please type
            <strong
                class="text-rose-600 dark:text-rose-400 font-mono">DELETE</strong>
            below:
        </p>

        <!-- Safety Confirmation Input -->
        <div>
            <input type="text" [(ngModel)]="confirmText"
                placeholder="Type DELETE here..."
                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-800 dark:text-slate-200 font-mono focus:outline-none focus:border-rose-500" />
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
            <button type="button" (click)="closeModal()"
                class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs rounded-xl transition cursor-pointer">
                Cancel
            </button>
            <button type="button" (click)="confirmDeletion()"
                [disabled]="confirmText !== 'DELETE'"
                class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold text-xs rounded-xl shadow-sm transition cursor-pointer">
                Permanently Delete
            </button>
        </div>

    </div>
</div>
}
