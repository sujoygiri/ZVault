@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/40 backdrop-blur-sm animate-fade-in"
    (click)="onClose()">

    <div class="w-full max-w-xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl shadow-xl overflow-hidden p-6 animate-scale-in"
        (click)="$event.stopPropagation()">

        <!-- Header -->
        <div
            class="flex items-center justify-between pb-3.5 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-2.5">
                <div
                    class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3
                    class="font-bold text-slate-900 dark:text-slate-50 text-base leading-tight">
                    {{ title() }}
                </h3>
            </div>

            <button (click)="onClose()"
                class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Content Body -->
        <div class="mt-4 max-h-[60vh] overflow-y-auto pr-1 scrollbar-thin [scrollbar-color:transparent_transparent] hover:[scrollbar-color:var(--color-slate-300)_transparent] dark:hover:[scrollbar-color:var(--color-slate-700)_transparent] [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-transparent hover:[&::-webkit-scrollbar-thumb]:bg-slate-300 dark:hover:[&::-webkit-scrollbar-thumb]:bg-slate-700 [&::-webkit-scrollbar-thumb]:rounded-full">
            <p
                class="text-xs wrap-break-word text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line bg-slate-50 dark:bg-slate-950/50 p-4 rounded-xl border border-slate-100 dark:border-slate-800/60">
                {{ content() || 'No content provided.' }}
            </p>
        </div>

        <!-- Footer Actions -->
        <div class="mt-6 flex justify-end">
            <button (click)="onClose()"
                class="w-full sm:w-auto bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold text-xs px-5 py-2.5 rounded-xl transition shadow-sm">
                Done
            </button>
        </div>

    </div>
</div>
}
