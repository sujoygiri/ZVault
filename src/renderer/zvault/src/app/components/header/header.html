<div class="px-10 pt-8 pb-4 shrink-0">
    <!-- HEADER ROW -->
    <header class="flex justify-between items-center mb-6">
        <h1
            class="text-2xl font-bold text-slate-900 dark:text-slate-50 tracking-tight">
            {{ title() }}
        </h1>

        <div class="flex items-center gap-4">
            <!-- Theme Switcher Switch Button -->
            <button (click)="toggleTheme.emit()"
                class="p-2 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl text-slate-500 dark:text-slate-400 transition shadow-sm cursor-pointer">
                @if (themeService.isDarkMode()) {
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                }
            </button>

            <!-- Dynamic Add Data Button -->
            <button
                class="bg-[#2563EB] hover:bg-blue-700 text-white font-medium text-sm px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer"
                (click)="addData.emit()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 4v16m8-8H4" />
                </svg>
                {{ addButtonText() }}
            </button>
        </div>
    </header>

    <!-- FILTER, SEARCH & SORT ROW -->
    <section class="flex flex-col sm:flex-row gap-4">
        <!-- Search Input -->
        <div class="relative flex-1">
            <span
                class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 dark:text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
            <input type="text" (input)="handlePasswordSearch($event)" placeholder="Search by title or website..."
                class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 pl-11 pr-4 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm placeholder-slate-400 dark:placeholder-slate-500 text-slate-700 dark:text-slate-200 transition shadow-sm">
        </div>

        <div class="flex items-center gap-3">
            <!-- Filter Dropdown -->
            <div class="relative min-w-32">
                <select
                    class="w-full appearance-none bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-2.5 pr-10 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm font-medium text-slate-700 dark:text-slate-300 transition shadow-sm cursor-pointer">
                    <option class="bg-white dark:bg-slate-900">All</option>
                    <option class="bg-white dark:bg-slate-900">Work</option>
                    <option class="bg-white dark:bg-slate-900">Finance</option>
                    <option class="bg-white dark:bg-slate-900">Social</option>
                    <option class="bg-white dark:bg-slate-900">Entertainment
                    </option>
                </select>
                <span
                    class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400 dark:text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19 9l-7 7-7-7" />
                    </svg>
                </span>
            </div>

            <!-- Sort Button -->
            <div class="relative min-w-32">
                <select (change)="sortChange.emit($any($event.target).value)"
                    class="w-full appearance-none bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-2.5 pr-10 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm font-medium text-slate-700 dark:text-slate-300 transition shadow-sm cursor-pointer">
                    <option value="name_asc" class="bg-white dark:bg-slate-900">
                        Name (A-Z)</option>
                    <option value="name_desc"
                        class="bg-white dark:bg-slate-900">Name (Z-A)</option>
                    <option value="date_newest"
                        class="bg-white dark:bg-slate-900">Newest First</option>
                    <option value="date_oldest"
                        class="bg-white dark:bg-slate-900">Oldest First</option>
                </select>
                <span
                    class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400 dark:text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
                    </svg>
                </span>
            </div>
        </div>
    </section>
</div>
