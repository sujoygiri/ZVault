<div
  class="flex min-h-[500px] items-center justify-center px-6"
>
  <div
    class="relative w-full max-w-xl overflow-hidden rounded-3xl border border-slate-200 bg-white p-10 text-center shadow-xl transition-all dark:border-slate-800 dark:bg-slate-900"
  >
    <!-- Background Glow -->
    <div
      class="absolute z-[-999] inset-0 bg-gradient-to-br from-cyan-500/5 via-transparent to-blue-500/5 dark:from-cyan-500/10 dark:to-blue-500/10"
    ></div>

    <!-- Icon -->
    <div
      class="relative mx-auto mb-8 flex h-24 w-24 items-center justify-center rounded-3xl border border-cyan-200 bg-cyan-50 dark:border-cyan-500/20 dark:bg-cyan-500/10"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-12 w-12 text-cyan-600 dark:text-cyan-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 15v2m-6 0h12a2 2 0 002-2v-5a2 2 0 00-2-2h-1V7a5 5 0 10-10 0v1H6a2 2 0 00-2 2v5a2 2 0 002 2z"
        />
      </svg>
    </div>

    <!-- Content -->
    <h2
      class="mb-3 text-3xl font-bold tracking-tight text-slate-900 dark:text-white"
    >
      {{ title() }}
    </h2>

    <p
      class="mx-auto max-w-md text-sm leading-7 text-slate-500 dark:text-slate-400"
    >
      {{ description() }}
    </p>

    <!-- Button -->
    <button class="mt-8 inline-flex items-center gap-2 rounded-xl bg-cyan-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 transition-all cursor-pointer hover:scale-[1.02] hover:bg-cyan-500 active:scale-[0.98]" (click)="handleDataEmit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" d="M12 5v14M5 12h14" />
      </svg>

      {{ buttonText() }}
    </button>
  </div>
</div>
