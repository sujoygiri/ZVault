<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="824" y2="824">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="zfill" gradientUnits="userSpaceOnUse" x1="0" y1="352" x2="0" y2="672">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#glow)"/>
  <!-- outer hairline ring -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="8"/>
  <!-- dial ring: four arcs, gaps on the diagonals -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#ring)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="440 78" transform="rotate(-38.2 512 512)"/>
  <!-- Z monogram -->
  <path d="M372 372 H652 L372 652 H652" fill="none" stroke="url(#zfill)" stroke-width="80"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dial indicator -->
  <circle cx="512" cy="512" r="41" fill="#0F1330"/>
  <circle cx="512" cy="512" r="30" fill="#22D3EE"/>
</svg>
